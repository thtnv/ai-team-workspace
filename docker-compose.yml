version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: syncpulse-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - syncpulse-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: syncpulse-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=syncpulse_workspace
      - SECRET_KEY=syncpulse-super-secret-jwt-key-2026
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-2.0-flash
    depends_on:
      - mongodb
    networks:
      - syncpulse-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: syncpulse-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - syncpulse-net

volumes:
  mongo_data:

networks:
  syncpulse-net:
    driver: bridge

